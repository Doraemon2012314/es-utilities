    const firebaseConfig = {
        apiKey: "AIzaSyBIMfz79oaJB8heW6SpQPqqnYUo4XhBHTk",
        authDomain: "es-utilities.firebaseapp.com",
        projectId: "es-utilities",
        storageBucket: "es-utilities.firebasestorage.app",
        messagingSenderId: "866486883282",
        appId: "1:866486883282:web:b3a676fc64f5485b64ee0b",
        measurementId: "G-E3K5F930RR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Discord OAuth (no Firebase Auth)
    const CLIENT_ID = "1493926695365771365";
    const REDIRECT_URI = window.location.origin + "/";
    const ALLOWED_ROLE = "1500487167070306344";
    const GUILD_ID = "1392627166549905620";

    let currentUser = null;
    let refreshInterval = null;
    let currentMembers = [];
    let currentUserFilter = "all";
    let currentPage = "overview";
    let charts = {};
    let unsubscribes = [];

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-5 right-5 z-50 bg-${isError ? 'red' : 'green'}-500/90 text-white px-4 py-2 rounded-lg text-sm shadow-lg`;
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Theme toggle
    window.toggleTheme = function() {
        const html = document.documentElement;
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
        } else {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        }
    };

    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
        }
    }

    // Discord OAuth
    function loginWithDiscord() {
        const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds.members.read`;
        window.location.href = authUrl;
    }

    async function verifyAndLogin(token) {
        try {
            const userResp = await fetch("https://discord.com/api/v10/users/@me", {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!userResp.ok) throw new Error("Invalid token");
            const user = await userResp.json();

            const guildResp = await fetch(`https://discord.com/api/v10/users/@me/guilds/${GUILD_ID}/member`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            let allowed = false;
            if (guildResp.ok) {
                const member = await guildResp.json();
                allowed = member.roles.includes(ALLOWED_ROLE);
            }
            if (!allowed) {
                alert("You do not have the required role to access this dashboard.");
                localStorage.removeItem('discord_token');
                location.reload();
                return;
            }
            currentUser = user;
            localStorage.setItem('discord_token', token);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('userName').innerText = user.username;
            const avatarEl = document.getElementById('userAvatar');
            if (user.avatar) {
                avatarEl.innerHTML = `<img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64" class="w-full h-full rounded-full object-cover">`;
            } else {
                avatarEl.innerText = user.username.charAt(0).toUpperCase();
            }
            loadPage('overview');
            startAutoRefresh();
        } catch (err) {
            console.error(err);
            alert("Login failed. Please try again.");
            localStorage.removeItem('discord_token');
            location.reload();
        }
    }

    function handleOAuthCallback() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        if (token) {
            localStorage.setItem('discord_token', token);
            window.history.replaceState({}, document.title, window.location.pathname);
            verifyAndLogin(token);
        } else {
            const stored = localStorage.getItem('discord_token');
            if (stored) verifyAndLogin(stored);
        }
    }

    function logout() {
        if (refreshInterval) clearInterval(refreshInterval);
        localStorage.removeItem('discord_token');
        location.reload();
    }

    // Firebase listeners and data fetching
    function cleanupListeners() {
        unsubscribes.forEach(unsub => unsub());
        unsubscribes = [];
    }

    function subscribeToTimePoints(callback) {
        return onSnapshot(collection(db, "time_points"), (snapshot) => {
            const points = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(points);
        });
    }

    function subscribeToPoints(callback) {
        return onSnapshot(query(collection(db, "points"), orderBy("points", "desc"), limit(50)), (snapshot) => {
            const points = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(points);
        });
    }

    function subscribeToTimeLogs(callback) {
        return onSnapshot(query(collection(db, "time_logs"), orderBy("timestamp", "desc"), limit(20)), (snapshot) => {
            const logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(logs);
        });
    }

    function subscribeToLOARequests(callback) {
        return onSnapshot(query(collection(db, "loa_requests"), where("status", "==", "pending")), (snapshot) => {
            const requests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(requests);
        });
    }

    function subscribeToTimeLogRequests(callback) {
        return onSnapshot(query(collection(db, "time_log_requests"), where("status", "==", "pending")), (snapshot) => {
            const requests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(requests);
        });
    }

    function subscribeToMidcomRequests(callback) {
        return onSnapshot(query(collection(db, "midcom_event_requests"), where("status", "==", "pending")), (snapshot) => {
            const requests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            callback(requests);
        });
    }

    // Approval functions
    async function approveLOA(id, userId, userName, rank, lengthDays, startDate, endDate, reason) {
        const docRef = doc(db, "loa_requests", id.toString());
        await updateDoc(docRef, { status: "approved", approved_by: currentUser?.username || "Web Dashboard", approved_at: new Date().toISOString() });
        showToast("LOA approved!");
        loadPage('requests');
    }

    async function approveTimeLog(requestId, userId, userName, rank, minutes) {
        const docRef = doc(db, "time_log_requests", requestId);
        await updateDoc(docRef, { status: "approved", approved_by: currentUser?.username || "Web Dashboard", approved_at: new Date().toISOString() });
        // Update user's total minutes
        const userRef = doc(db, "time_points", userId);
        const userSnap = await getDocs(query(collection(db, "time_points"), where("user_id", "==", userId)));
        // simplified: you can implement the increment logic
        showToast("Time log approved!");
        loadPage('requests');
    }

    async function approveMidcom(requestId, userId, userName, pointsEarned) {
        const docRef = doc(db, "midcom_event_requests", requestId);
        await updateDoc(docRef, { status: "approved", approved_by: currentUser?.username || "Web Dashboard", approved_at: new Date().toISOString() });
        showToast("Midcom event approved!");
        loadPage('requests');
    }

    async function denyRequest(collectionName, docId, reason) {
        const docRef = doc(db, collectionName, docId);
        await updateDoc(docRef, { status: "denied", deny_reason: reason, denied_by: currentUser?.username || "Web Dashboard", denied_at: new Date().toISOString() });
        showToast("Request denied!");
        loadPage('requests');
    }

    window.approveLOA = approveLOA;
    window.approveTimeLog = approveTimeLog;
    window.approveMidcom = approveMidcom;
    window.denyRequest = denyRequest;

    // Page loaders (implement similarly to previous version, but using listeners)
    async function loadPage(page) {
        const main = document.getElementById('mainContent');
        main.innerHTML = '<div class="p-6 md:p-8"><div class="flex items-center justify-center h-64"><div class="loading-spinner"></div><p class="ml-3 text-gray-500">Loading...</p></div></div>';
        cleanupListeners();
        if (page === 'overview') {
            const unsub = subscribeToTimePoints((points) => {
                const totalStaff = points.length;
                const totalHours = points.reduce((s,p) => s + (p.total_minutes||0), 0);
                const activeStaff = points.filter(p => (p.total_minutes||0) > 20).length;
                const passed = points.filter(p => (p.total_minutes||0) >= 100).length;
                const passRate = totalStaff ? Math.round(passed/totalStaff*100) : 0;
                const activeRate = totalStaff ? Math.round(activeStaff/totalStaff*100) : 0;
                main.innerHTML = `
                    <div class="p-6 md:p-8">
                        <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">Moderation Overview</h2><button onclick="location.reload()" class="refresh-btn bg-gray-200 dark:bg-zinc-800 px-4 py-2 rounded-xl">Refresh</button></div>
                        <div class="stats-grid">
                            <div class="stat-card rounded-xl p-4"><div><p class="text-xs text-gray-500">Total Staff</p><p class="text-3xl font-bold">${totalStaff}</p></div></div>
                            <div class="stat-card rounded-xl p-4"><div><p class="text-xs text-gray-500">Active This Week</p><p class="text-3xl font-bold">${activeStaff}</p><div class="mt-2 text-xs">Active rate: ${activeRate}%</div></div></div>
                            <div class="stat-card rounded-xl p-4"><div><p class="text-xs text-gray-500">Total Hours</p><p class="text-3xl font-bold">${totalHours}</p></div></div>
                            <div class="stat-card rounded-xl p-4"><div><p class="text-xs text-gray-500">Quota Pass Rate</p><p class="text-3xl font-bold">${passRate}%</p><div class="progress-bar-container mt-2"><div class="progress-bar-fill" style="width:${passRate}%"></div></div></div></div>
                        </div>
                        <div class="grid lg:grid-cols-2 gap-6">
                            <div class="chart-container"><canvas id="quotaChart"></canvas></div>
                            <div class="chart-container"><canvas id="topChart"></canvas></div>
                        </div>
                    </div>`;
                const quotaCtx = document.getElementById('quotaChart')?.getContext('2d');
                if (quotaCtx) new Chart(quotaCtx, { type: 'doughnut', data: { labels: ['Passed', 'Needs Work', 'No Hours'], datasets: [{ data: [passed, points.filter(p=>p.total_minutes>0 && p.total_minutes<100).length, points.filter(p=>p.total_minutes===0).length], backgroundColor: ['#10b981','#f59e0b','#ef4444'] }] } });
                const top5 = [...points].sort((a,b)=>b.total_minutes - a.total_minutes).slice(0,5);
                const topCtx = document.getElementById('topChart')?.getContext('2d');
                if (topCtx) new Chart(topCtx, { type: 'bar', data: { labels: top5.map(p=>p.user_name?.slice(0,15)), datasets: [{ label: 'Hours', data: top5.map(p=>p.total_minutes), backgroundColor: '#3b82f6' }] }, options: { indexAxis: 'y' } });
            });
            unsubscribes.push(unsub);
        } else if (page === 'requests') {
            main.innerHTML = '<div class="p-6 md:p-8"><div class="loading-spinner"></div><p>Loading requests...</p></div>';
            const loaUnsub = subscribeToLOARequests(async (loas) => {
                const timelogUnsub = subscribeToTimeLogRequests(async (timelogs) => {
                    const midcomUnsub = subscribeToMidcomRequests(async (midcoms) => {
                        main.innerHTML = `
                            <div class="p-6 md:p-8">
                                <h2 class="text-2xl font-bold mb-4">Pending Requests</h2>
                                <div class="mb-8"><h3 class="text-lg font-semibold mb-2">LOA Requests (${loas.length})</h3>${loas.map(l => `
                                    <div class="request-card"><div class="flex justify-between"><div><p><strong>${escapeHtml(l.user_name)}</strong> (${l.rank})</p><p>${l.length_days} days (${l.start_date} to ${l.end_date})</p><p>${l.reason}</p></div><div class="flex gap-2"><button onclick="approveLOA('${l.id}', '${l.user_id}', '${escapeHtml(l.user_name)}', '${l.rank}', ${l.length_days}, '${l.start_date}', '${l.end_date}', '${escapeHtml(l.reason)}')" class="btn-success btn-sm">Approve</button><button onclick="denyRequest('loa_requests', '${l.id}', prompt('Reason for denial'))" class="btn-danger btn-sm">Deny</button></div></div></div>`).join('') || '<div class="text-gray-500">No pending LOA requests</div>'}</div>
                                <div class="mb-8"><h3 class="text-lg font-semibold mb-2">Time Log Requests (${timelogs.length})</h3>${timelogs.map(t => `
                                    <div class="request-card"><div class="flex justify-between"><div><p><strong>${escapeHtml(t.user_name)}</strong> (${t.rank})</p><p>${t.minutes} minutes</p>${t.proof_url ? `<a href="${t.proof_url}" target="_blank" class="text-blue-500 text-sm">Proof</a>` : ''}${t.additional_info ? `<p class="text-sm text-gray-500">${t.additional_info}</p>` : ''}</div><div class="flex gap-2"><button onclick="approveTimeLog('${t.id}', '${t.user_id}', '${escapeHtml(t.user_name)}', '${t.rank}', ${t.minutes})" class="btn-success btn-sm">Approve</button><button onclick="denyRequest('time_log_requests', '${t.id}', prompt('Reason for denial'))" class="btn-danger btn-sm">Deny</button></div></div></div>`).join('') || '<div class="text-gray-500">No pending time log requests</div>'}</div>
                                <div><h3 class="text-lg font-semibold mb-2">Midcom Event Requests (${midcoms.length})</h3>${midcoms.map(m => `
                                    <div class="request-card"><div class="flex justify-between"><div><p><strong>${escapeHtml(m.user_name)}</strong> (${m.role})</p><p>Event: ${m.event}</p><p>${m.points_earned} points</p>${m.additional_notes ? `<p class="text-sm">${m.additional_notes}</p>` : ''}</div><div class="flex gap-2"><button onclick="approveMidcom('${m.id}', '${m.user_id}', '${escapeHtml(m.user_name)}', ${m.points_earned})" class="btn-success btn-sm">Approve</button><button onclick="denyRequest('midcom_event_requests', '${m.id}', prompt('Reason for denial'))" class="btn-danger btn-sm">Deny</button></div></div></div>`).join('') || '<div class="text-gray-500">No pending midcom event requests</div>'}</div>
                            </div>`;
                    });
                    unsubscribes.push(midcomUnsub);
                });
                unsubscribes.push(timelogUnsub);
            });
            unsubscribes.push(loaUnsub);
        } else {
            main.innerHTML = `<div class="p-6 md:p-8"><div class="text-center text-gray-500">Page ${page} coming soon (implement similarly)</div></div>`;
        }
        switchPage(page);
    }

    function switchPage(page) {
        document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.closest('.nav-link').classList.add('active');
        currentPage = page;
        if (window.innerWidth < 768) closeMobileMenu();
    }

    function refreshCurrentPage() { loadPage(currentPage); }
    function startAutoRefresh() { if (refreshInterval) clearInterval(refreshInterval); refreshInterval = setInterval(() => refreshCurrentPage(), 60000); }
    function closeMobileMenu() { document.getElementById('sidebar')?.classList.remove('mobile-open'); document.getElementById('mobileMenuOverlay')?.classList.remove('active'); }

    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.add('mobile-open');
        document.getElementById('mobileMenuOverlay')?.classList.add('active');
    });
    document.getElementById('mobileMenuOverlay')?.addEventListener('click', closeMobileMenu);

    window.switchPage = switchPage;
    window.refreshCurrentPage = refreshCurrentPage;
    window.logout = logout;
    document.getElementById('discordLoginBtn')?.addEventListener('click', loginWithDiscord);

    initTheme();
    handleOAuthCallback();
</script>
